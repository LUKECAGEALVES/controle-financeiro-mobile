<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b5fc7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Financeiro" />
  <title>Controle Financeiro Mobile</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-row">
        <div class="brand-mark">R$</div>
        <div>
          <div class="brand-title">CONTROLE FINANCEIRO</div>
          <div class="brand-subtitle">Mobile v0.3</div>
        </div>
      </div>
      <button class="icon-btn" id="installBtn" aria-label="Instalar aplicativo" title="Instalar aplicativo" hidden>＋</button>
    </header>

    <main id="view" class="view"></main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button data-route="home" class="nav-item active"><span>⌂</span><small>Início</small></button>
      <button data-route="transactions" class="nav-item"><span>⇄</span><small>Movimentações</small></button>
      <button data-route="goals" class="nav-item"><span>◎</span><small>Metas</small></button>
      <button data-route="networth" class="nav-item"><span>◆</span><small>Patrimônio</small></button>
      <button data-route="more" class="nav-item"><span>☰</span><small>Mais</small></button>
    </nav>
  </div>

  <div id="modalHost" class="modal-host hidden"></div>
  <input id="importFile" type="file" accept="application/json" hidden />
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
